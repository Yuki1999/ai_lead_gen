version: '1.0'
name: pr-pipeline
displayName: CI（合并请求）
stages:
  - stage:
    name: test
    displayName: 后端测试
    steps:
      - step: build@python
        name: backend_test
        displayName: 后端 pytest
        pythonVersion: '3.12'
        commands:
          - cd backend
          - pip3 config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
          - pip3 install -e . pytest httpx
          - python3 -m pytest -q
  - stage:
    name: build
    displayName: 前端与 Agent 构建
    steps:
      - step: build@nodejs
        name: frontend_build
        displayName: 前端构建（vue-tsc + vite）
        nodeVersion: '20'
        commands:
          - cd frontend
          - npm ci
          - npm run build
      - step: build@nodejs
        name: agent_build
        displayName: Agent 构建（tsc）
        nodeVersion: '20'
        commands:
          - cd agent
          - npm ci
          - npm run build
triggers:
  pr:
    branches:
      include:
        - master
